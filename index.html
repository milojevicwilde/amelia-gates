<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amelia Gates</title>
<meta name="description" content="Amelia Gates — New York, NY.">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<!-- fixed masthead: never moves -->
<header class="masthead" id="masthead">
  <a class="brand" href="#top" data-goto="0">
    <span class="wordmark">Amelia Gates</span>
    <span class="rule" aria-hidden="true"></span>
  </a>
</header>

<!-- soft dissolve where content passes under the masthead / footer -->
<div class="veil veil--top" aria-hidden="true"></div>
<div class="veil veil--bottom" aria-hidden="true"></div>

<main class="scroller" id="scroller">

  <!-- ===== PANEL 1 ===== -->
  <section class="panel" id="top" aria-label="Amelia Gates">

    <figure class="hero">
      <img src="img/hero-2400.jpg"
           srcset="img/hero-1400.jpg 1400w, img/hero-2400.jpg 2400w"
           sizes="(max-width: 820px) 100vw, 880px"
           width="2400" height="1600"
           alt="Amelia Gates reclining on a writing desk between two windows.">
    </figure>

    <p class="caption"><span>Ivy-League Educated Creative Mind</span> <span>and Know-It-All</span></p>

    <button class="arrow" type="button" data-goto="1" aria-label="Scroll down">
      <svg viewBox="0 0 32 18" aria-hidden="true" focusable="false">
        <polyline points="1,1 16,16 31,1"></polyline>
      </svg>
    </button>

  </section>

  <!-- ===== PANEL 2 ===== -->
  <section class="panel panel--two" id="contact" aria-label="Contact">

    <button class="arrow arrow--up" type="button" data-goto="0" aria-label="Back to top">
      <svg viewBox="0 0 32 18" aria-hidden="true" focusable="false">
        <polyline points="1,17 16,2 31,17"></polyline>
      </svg>
    </button>

    <div class="split">

      <figure class="portrait">
        <img src="img/portrait-2400.jpg"
             srcset="img/portrait-1400.jpg 1400w, img/portrait-2400.jpg 2400w"
             sizes="(max-width: 820px) 100vw, 56vw"
             width="2400" height="1600"
             alt="Portrait of Amelia Gates.">
      </figure>

      <div class="statement">
        <p>Man's attitude goes some ways, the way his life will be.</p>
        <p>If you care about the good life, fix your attitude and call this
           number: <span class="tel">+1&nbsp;(910)&nbsp;689-8123</span></p>
      </div>

    </div>

  </section>

</main>

<footer class="footer">
  <a class="footer-tel" href="tel:+19106898123">+1 (910) 689-8123</a>
  <span class="footer-place">New York, NY — © 2026 Amelia Gates</span>
</footer>

<script src="js/scroll.js?v=3"></script>
</body>
</html>
